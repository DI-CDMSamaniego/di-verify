<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>My ID, Government IDs &amp; Certificates · D.I Engineering Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff;color:#000}
body{font-family:"Josefin Sans","Century Gothic","Avenir Next",Helvetica,Arial,sans-serif;font-weight:300;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;background:#000;display:flex;justify-content:center;padding:8px 0 0}
.logo{width:min(50vw,180px);height:auto;display:block}
main{width:100%;max-width:520px;padding:22px 18px 32px;flex:1}
h1{font-size:22px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-align:center}
.label{font-size:11px;letter-spacing:.32em;text-transform:uppercase;text-align:center;margin:8px 0 22px}
.who{text-align:center;margin-bottom:22px}
.who .n{font-size:20px;font-weight:400;letter-spacing:.05em;text-transform:uppercase}
.who .i{font-size:12px;letter-spacing:.25em;margin-top:6px}
.det{display:inline-block;margin-top:10px;border:1px solid #000;padding:6px 12px;font-size:13px;letter-spacing:.04em;max-width:100%;word-break:break-all}
.det .k{font-size:10px;letter-spacing:.25em;text-transform:uppercase;margin-right:8px}
h2{font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;border-bottom:1px solid #000;padding-bottom:8px;margin:26px 0 14px}
.ids{display:grid;grid-template-columns:1fr 1fr;gap:12px}
figure{border:1px solid #000;padding:8px;display:flex;flex-direction:column}
figure img{width:100%;height:auto;display:block;cursor:zoom-in}
figcaption{font-size:11px;letter-spacing:.25em;text-transform:uppercase;text-align:center;margin:8px 0}
.btn{display:block;text-align:center;background:#000;color:#fff;text-decoration:none;font:inherit;font-size:12px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;padding:11px 8px;border:1px solid #000;cursor:pointer;width:100%}
.btn.o{background:#fff;color:#000}
.cert{border:1px solid #000;padding:12px;margin-bottom:12px}
.cert .t{font-size:15px;font-weight:400;letter-spacing:.04em;margin-bottom:4px;word-break:break-word}
.cert .d{font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px}
.cert img{width:100%;height:auto;display:block;border:1px solid #000;margin-bottom:10px}
.row{display:flex;gap:8px}
.gov{border:1px solid #000}
.gov .g{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 12px;border-top:1px solid #000}
.gov .g:first-child{border-top:0}
.gov .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;flex:0 0 auto}
.gov .v{font-size:15px;font-weight:400;letter-spacing:.04em;text-align:right;word-break:break-word}
.gov .x{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-top:4px}
.empty{font-size:14px;letter-spacing:.06em;text-align:center;padding:22px 10px;border:1px dashed #000}
.box{border:3px solid #000;padding:26px 16px;text-align:center}
.box .b{font-size:24px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.msg{font-size:14px;line-height:1.6;letter-spacing:.04em;margin-top:12px}
.note{font-size:10px;letter-spacing:.2em;text-transform:uppercase;text-align:center;margin-top:24px;line-height:1.7}
footer{width:100%;text-align:center;font-size:10px;letter-spacing:.3em;padding:16px;border-top:1px solid #000;text-transform:uppercase}
@media (max-width:360px){.ids{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 860" role="img" aria-label="D.I Engineering Services logo" class="logo"><rect width="1024" height="860" fill="#000"/><g transform="translate(-40,0)" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="miter" stroke-linecap="square">
<polyline points="415,430 415,110 610,110 655,155 655,168"/>
<polyline points="655,212 655,485 610,530 415,530"/>
<line x1="565" y1="190" x2="675" y2="190"/>
<polyline points="610,190 610,512"/>
<polyline points="610,548 610,580"/>
<line x1="565" y1="580" x2="675" y2="580"/></g>
<text x="512" y="700" text-anchor="middle" fill="#fff" font-family="Josefin Sans, Century Gothic, Avenir Next, Helvetica, Arial, sans-serif" font-weight="300" font-size="40" letter-spacing="14">D.I ENGINEERING</text>
<line x1="270" y1="742" x2="360" y2="742" stroke="#9e9e9e" stroke-width="1.5"/><line x1="664" y1="742" x2="754" y2="742" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="512" y="750" text-anchor="middle" fill="#bdbdbd" font-family="Josefin Sans, Century Gothic, Avenir Next, Helvetica, Arial, sans-serif" font-weight="300" font-size="24" letter-spacing="10">SERVICES</text></svg></header>
<main>
  <h1>D.I Engineering Services</h1>
  <p class="label">My ID, Government IDs &amp; Certificates</p>
  <div id="out" aria-live="polite"><p class="msg" style="text-align:center">Loading&hellip;</p></div>
</main>
<footer>D.I Engineering Services &middot; Private page</footer>
<noscript><p style="text-align:center;padding:16px">JavaScript is required to open this page.</p></noscript>
<script>
(function(){
"use strict";
var SALT="DI-PORTAL-v1-salt", INFO="DI-PORTAL-v1 aes-256-gcm key";
var out=document.getElementById("out"), enc=new TextEncoder(), KEY=null;
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function clear(){while(out.firstChild)out.removeChild(out.firstChild);}
function box(title,msg){clear();var b=el("div","box");b.appendChild(el("p","b",title));b.appendChild(el("p","msg",msg));out.appendChild(b);}
function b64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return x.toString(16).padStart(2,"0");}).join("");}
function open_(u8){return crypto.subtle.decrypt({name:"AES-GCM",iv:u8.slice(0,12)},KEY,u8.slice(12));}
function okImg(s){return typeof s==="string"&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(s);}
function dlLink(href,name,label,cls){var a=el("a","btn"+(cls?" "+cls:""),label);a.href=href;a.download=name;return a;}
function idFig(src,cap,name){
  var f=el("figure"),img=el("img");img.src=src;img.alt=cap;img.onclick=function(){window.open(src,"_blank");};
  f.appendChild(img);f.appendChild(el("figcaption",null,cap));f.appendChild(dlLink(src,name,"Download"));return f;
}
async function certCard(c,def){
  def=def||"Certificate";
  var d=el("div","cert");d.appendChild(el("p","t",c.title||def));
  if(c.added)d.appendChild(el("p","d","Added "+c.added));
  var st=el("p","d","Loading…");d.appendChild(st);
  try{
    var r=await fetch("p/"+encodeURIComponent(c.f)+".bin",{cache:"no-store"});if(!r.ok)throw 0;
    var pt=await open_(new Uint8Array(await r.arrayBuffer()));
    var type=/^(application\/pdf|image\/(jpeg|png|webp|gif))$/.test(c.type)?c.type:"application/octet-stream";
    var url=URL.createObjectURL(new Blob([pt],{type:type}));
    st.remove();
    if(type.indexOf("image/")===0){var im=el("img");im.src=url;im.alt=c.title||def;d.appendChild(im);}
    var row=el("div","row");
    if(type!=="application/octet-stream"){var v=el("a","btn o","View");v.href=url;v.target="_blank";v.rel="noopener";row.appendChild(v);}
    row.appendChild(dlLink(url,c.name||def.toLowerCase(),"Download"));d.appendChild(row);
  }catch(e){st.textContent="Could not load this file. Try again later.";}
  return d;
}
async function section(title,items,emptyText,def){
  out.appendChild(el("h2",null,title));
  if(!items.length){out.appendChild(el("p","empty",emptyText));return;}
  var wrap=el("div");out.appendChild(wrap);
  for(var i=0;i<items.length;i++){wrap.appendChild(await certCard(items[i],def));}
}
function govSection(items){
  out.appendChild(el("h2",null,"Government IDs"));
  items=items.filter(function(x){return x&&typeof x.l==="string"&&typeof x.v==="string"&&x.l&&x.v;});
  if(!items.length){out.appendChild(el("p","empty","No government IDs yet"));return;}
  var w=el("div","gov");
  for(var i=0;i<items.length;i++){
    var r=el("div","g");r.appendChild(el("span","k",items[i].l));
    var v=el("span","v",items[i].v);
    if(typeof items[i].x==="string"&&items[i].x)v.appendChild(el("span","x","Valid until "+items[i].x));
    r.appendChild(v);w.appendChild(r);
  }
  out.appendChild(w);
}
async function show(p){
  clear();
  var w=el("div","who");w.appendChild(el("p","n",p.name||""));w.appendChild(el("p","i","ID No. "+(p.id_no||"")));
  if(typeof p.email==="string"&&p.email){var d=el("div","det");d.appendChild(el("span","k","Email"));d.appendChild(el("span","v",p.email));w.appendChild(d);}  /* no "email" = none shown */
  out.appendChild(w);
  out.appendChild(el("h2",null,"My ID Card"));
  var g=el("div","ids");
  if(okImg(p.front))g.appendChild(idFig(p.front,"Front",(p.id_no||"ID")+" ID Front.jpg"));
  if(okImg(p.back))g.appendChild(idFig(p.back,"Back",(p.id_no||"ID")+" ID Back.jpg"));
  if(!g.firstChild)g.appendChild(el("p","empty","ID card image not available yet"));
  out.appendChild(g);
  govSection(Array.isArray(p.gov)?p.gov:[]);  /* no "gov" = older payload = none */
  var cs=Array.isArray(p.certs)?p.certs:[], ids=[], certs=[];
  for(var i=0;i<cs.length;i++){(cs[i]&&cs[i].cat==="cert"?certs:ids).push(cs[i]);}  /* no "cat" = old item = Other IDs */
  await section("Other IDs",ids,"No other IDs yet","ID");
  await section("Certificates",certs,"No certificates yet","Certificate");
  out.appendChild(el("p","note","This page is private. Do not share your QR code or link."));
}
async function run(){
  var t=new URLSearchParams(location.search).get("t");
  if(t===null){box("Scan your QR","Scan the personal QR code given to you by D.I Engineering Services to open your ID, other IDs and certificates.");return;}
  t=t.trim();
  if(!/^[A-Za-z0-9_-]{24,128}$/.test(t)){box("Link not valid","This link is not valid. Please scan your personal QR code again.");return;}
  if(!(window.crypto&&crypto.subtle)){box("Browser not supported","Please open this link in an up-to-date browser (HTTPS required).");return;}
  try{
    var tb=enc.encode(t), lookup=hex(await crypto.subtle.digest("SHA-256",tb));
    var res=await fetch("p/"+lookup+".json",{cache:"no-store"});
    if(res.status===404){box("Link not valid","This link is not valid or is no longer active.");return;}
    if(!res.ok)throw 0;
    var j=await res.json();
    var ikm=await crypto.subtle.importKey("raw",tb,"HKDF",false,["deriveKey"]);
    KEY=await crypto.subtle.deriveKey({name:"HKDF",hash:"SHA-256",salt:enc.encode(SALT),info:enc.encode(INFO)},ikm,{name:"AES-GCM",length:256},false,["decrypt"]);
    var p=JSON.parse(new TextDecoder().decode(await open_(b64(j.blob))));
    if(p.status!=="active"){box("Access disabled","Access to this page has been disabled. Please contact D.I Engineering Services.");return;}
    await show(p);
  }catch(e){box("Could not open","Something went wrong. Check your connection and try again.");}
}
run();
})();
</script>
